plugins {
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing for this Wear module reuses the SAME upload key already
// registered in Play Console for app.bookwithai.app (same-package/same-
// listing architecture -- see wearos/README or the R1 release-architecture
// notes). Values are read at config time from the repo-root credentials.json
// that `eas credentials -p android` exports locally -- that file (and the
// keystore it points to) are gitignored and MUST NEVER be committed. This
// block is a no-op (release stays unsigned) if credentials.json isn't
// present locally, so a fresh checkout without it still configures/compiles.
def wearCredentialsFile = rootProject.file('../credentials.json')
def wearCredentials = wearCredentialsFile.exists()
    ? new groovy.json.JsonSlurper().parse(wearCredentialsFile).android.keystore
    : null

android {
  namespace 'app.bookwithai.app.wear'
  // Reuses the same compileSdk the phone app resolves via Expo's gradle
  // plugin (set dynamically by rootProject.ext, same pattern app/build.gradle
  // uses) so this module never drifts from whatever SDK the rest of the
  // project is building against.
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    // Same package as the phone app (app.bookwithai.app) -- required so this
    // Wear APK ships as a form factor under the existing Play Store listing
    // (Play Console > Advanced settings > Form factors > Add form factor >
    // Wear OS), per Google's own guidance for a dependent companion app.
    // Kotlin source namespace stays app.bookwithai.app.wear (see `namespace`
    // above) -- applicationId and source namespace don't need to match.
    applicationId "app.bookwithai.app"
    // Wear OS 3+ minimum (Galaxy Watch 4+, all current Pixel Watches) --
    // standard androidx.wear.compose APIs require this floor regardless of
    // the phone app's own minSdkVersion.
    minSdkVersion 30
    targetSdkVersion rootProject.ext.targetSdkVersion
    // Independent Wear versionCode scheme (Google recommends the Wear form
    // factor's versionCode NOT share a counter with the phone's), encoded as
    // <targetSdk 36><phone release 1.0.7 -> 107><wear release 01><wear build 01/02/...>.
    // Always > the phone's own versionCode (currently 16) and has headroom
    // long past any near-term phone versionCode growth. Bumped from
    // ...101 -> ...102: Play Console rejected 101 as "already been used"
    // after it landed in the project's bundle library on first upload.
    versionCode 361070102
    versionName "1.0.7"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures {
    compose true
  }

  if (wearCredentials != null) {
    signingConfigs {
      release {
        storeFile rootProject.file("../${wearCredentials.keystorePath}")
        storePassword wearCredentials.keystorePassword
        keyAlias wearCredentials.keyAlias
        keyPassword wearCredentials.keyPassword
      }
    }
  }

  buildTypes {
    release {
      if (wearCredentials != null) {
        signingConfig signingConfigs.release
      }
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
  implementation "androidx.activity:activity-compose:1.9.2"

  implementation platform("androidx.compose:compose-bom:2024.09.00")
  implementation "androidx.wear.compose:compose-material:1.4.0"
  implementation "androidx.wear.compose:compose-foundation:1.4.0"
  // Wear's own swipe-to-dismiss NavHost -- the standard Wear OS navigation
  // convention (swipe-from-left-edge back gesture), used for Home ->
  // Schedule -> Appointment Detail. Free, standard AndroidX library.
  implementation "androidx.wear.compose:compose-navigation:1.4.0"
  implementation "androidx.wear:wear:1.3.0"

  // Wearable Data Layer API -- free, no per-call/usage charge. Standard
  // Google API, not Samsung-specific; works identically on Galaxy Watch and
  // Pixel Watch (both are standard Wear OS 3+/4+ devices).
  implementation "com.google.android.gms:play-services-wearable:19.0.0"

  // P5 -- "Open on Phone": the standard, current AndroidX API for a watch
  // app to launch an activity/deep link on the paired phone. Free, not
  // Samsung-specific, replaces the older com.google.android.gms.wearable.
  // RemoteIntent class this library wraps.
  implementation "androidx.wear:wear-remote-interactions:1.1.0"

  // P5 -- Tile glance surface for NEXT. Standard AndroidX Wear Tiles +
  // ProtoLayout APIs, free, not Samsung-specific -- supported the same way
  // on Galaxy Watch, Pixel Watch, and any other current Wear OS device.
  implementation "androidx.wear.tiles:tiles:1.4.0"
  implementation "androidx.wear.protolayout:protolayout:1.2.0"
  implementation "androidx.wear.protolayout:protolayout-material:1.2.0"
  implementation "com.google.guava:guava:33.3.1-android"
}
