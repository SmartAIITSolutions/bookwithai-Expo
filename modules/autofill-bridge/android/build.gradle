apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.autofillbridge'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.autofillbridge"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// AutofillManager is part of the Android SDK itself (API 26+) -- no extra
// dependency needed, unlike wear-bridge's Play Services Wearable API.
