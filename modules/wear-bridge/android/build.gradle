apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.wearbridge'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.wearbridge"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Wearable Data Layer API — part of Google Play Services, free, no
  // per-call/usage charge. Used only to sync a small derived summary
  // (never a raw auth token) to a paired Wear OS device.
  implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
